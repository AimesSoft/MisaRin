name: rust_lib_misa_rin
description: "Utility to build Rust code"
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  ffi: ^2.0.2
  ffigen: ^11.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        pluginClass: RustLibMisaRinPlugin
      windows:
        pluginClass: RustLibMisaRinPlugin
        fileName: rust_lib_misa_rin_plugin.cpp
      web:
        pluginClass: RustLibMisaRinWeb
        fileName: rust_lib_misa_rin_web.dart
