name: Build Android APK

on:
  workflow_call:
    inputs:
      version:
        description: Target version used for artifact naming
        required: true
        type: string
      arch:
        description: CPU architecture label used in artifact naming
        required: false
        default: arm64
        type: string
      build_number:
        description: Android versionCode (optional, defaults to GitHub run number)
        required: false
        default: ""
        type: string
    secrets:
      ANDROID_KEYSTORE_B64:
        description: Base64 encoded keystore (.jks)
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        description: Keystore password
        required: true
      ANDROID_KEY_ALIAS:
        description: Key alias
        required: true
      ANDROID_KEY_PASSWORD:
        description: Key password
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version }}
      TARGET_ARCH: ${{ inputs.arch }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: 获取依赖
        run: flutter pub get
      - name: 准备 Android 签名
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_B64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Android 签名 secrets 缺失，请检查 ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD" >&2
            exit 1
          fi

          printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 --decode > android/keystore.jks
          chmod 600 android/keystore.jks
          echo "keystore sha256: $(sha256sum android/keystore.jks | awk '{print $1}')"

          # 先校验 keystore 密码可读取，并输出别名列表用于诊断（不包含敏感信息）。
          keytool -list \
            -keystore android/keystore.jks \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            >/tmp/keystore-list.txt
          echo "keystore aliases:"
          cat /tmp/keystore-list.txt

          # 校验指定 alias 存在。
          if ! keytool -list \
            -keystore android/keystore.jks \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" \
            >/dev/null 2>&1; then
            echo "指定的 ANDROID_KEY_ALIAS 在 keystore 中不存在，或 keystore 密码不正确。" >&2
            exit 1
          fi

          # 强校验：必须能解锁私钥（验证 key password + alias 正确）。
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          printf 'misa-rin-sign-check\n' > "${tmp_dir}/README.txt"
          jar cf "${tmp_dir}/check.jar" -C "${tmp_dir}" README.txt >/dev/null
          if ! jarsigner \
            -keystore android/keystore.jks \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -keypass "${ANDROID_KEY_PASSWORD}" \
            "${tmp_dir}/check.jar" \
            "${ANDROID_KEY_ALIAS}" \
            >/dev/null 2>&1; then
            echo "无法解锁 keystore 私钥：请检查 ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 是否与该 keystore 匹配。" >&2
            exit 1
          fi
      - name: 构建 Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${BUILD_NUMBER:-}"
          if [[ -z "${BUILD_NUMBER}" ]]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi
          case "${TARGET_ARCH}" in
            arm64)
              TARGET_PLATFORM="android-arm64"
              ABI_SUFFIX="arm64-v8a"
              ;;
            armv7)
              TARGET_PLATFORM="android-arm"
              ABI_SUFFIX="armeabi-v7a"
              ;;
            x64|x86_64)
              TARGET_PLATFORM="android-x64"
              ABI_SUFFIX="x86_64"
              ;;
            *)
              echo "不支持的 Android 架构: ${TARGET_ARCH}" >&2
              exit 1
              ;;
          esac

          flutter build apk --release \
            --target-platform "${TARGET_PLATFORM}" \
            --build-name "${APP_VERSION}" \
            --build-number "${BUILD_NUMBER}"

          OUTPUT_DIR="build/app/outputs/flutter-apk"
          if [[ ! -d "${OUTPUT_DIR}" ]]; then
            echo "未找到 Android 构建输出目录: ${OUTPUT_DIR}" >&2
            exit 1
          fi

          APK_PATH="${OUTPUT_DIR}/app-${ABI_SUFFIX}-release.apk"
          if [[ ! -f "${APK_PATH}" ]]; then
            APK_PATH=$(find "${OUTPUT_DIR}" -maxdepth 1 -type f -name "*${ABI_SUFFIX}*release*.apk" -print -quit || true)
          fi
          if [[ -z "${APK_PATH}" ]] || [[ ! -f "${APK_PATH}" ]]; then
            if [[ -f "${OUTPUT_DIR}/app-release.apk" ]]; then
              APK_PATH="${OUTPUT_DIR}/app-release.apk"
            else
              echo "未找到 Android APK 输出文件" >&2
              ls -al "${OUTPUT_DIR}" >&2
              exit 1
            fi
          fi

          ARTIFACT_DIR="build/artifacts"
          mkdir -p "${ARTIFACT_DIR}"
          ARTIFACT_NAME="MisaRin-android-${TARGET_ARCH}-${APP_VERSION}.apk"
          cp "${APK_PATH}" "${ARTIFACT_DIR}/${ARTIFACT_NAME}"
      - name: 上传 Android 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MisaRin-android-${{ env.TARGET_ARCH }}-${{ env.APP_VERSION }}.apk
          path: build/artifacts/MisaRin-android-${{ env.TARGET_ARCH }}-${{ env.APP_VERSION }}.apk
          if-no-files-found: error
